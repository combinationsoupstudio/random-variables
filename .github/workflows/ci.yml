name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint:
    name: GDScript lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "gdtoolkit==4.*"
      - run: gdformat --check scripts/ scenes/ || (echo "::error::run gdformat scripts/ scenes/ and commit" && exit 1)
      - run: gdlint scripts/ scenes/
  godot:
    name: Godot headless import + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with: { version: 4.7.2, use-dotnet: false, include-templates: false }
      - name: Import project
        run: godot --headless --import --path . 2>&1 | tee import.log; ! grep -E "ERROR|SCRIPT ERROR" import.log
      - name: Unit tests (GUT)
        run: |
          if [ -d addons/gut ]; then godot --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests -gexit -gjunit_xml_file=res://gut.xml; else echo "GUT not installed yet (M1); skipping"; fi
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: webiny/action-conventional-commits@v1.3.0
